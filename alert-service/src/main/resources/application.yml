spring:
  application:
    name: ALERT-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dpdms_alerts}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:dpdms}
    password: ${DB_PASSWORD:dpdms}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8090

eureka:
  client:
    serviceUrl:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

dpdms:
  gateway-secret: ${GATEWAY_SECRET:dpdms-gateway-dev-secret-please-change}
  alert-email-from: ${ALERT_EMAIL_FROM:dpdms@example.com}
  default-email-recipients: ${ALERT_EMAIL_RECIPIENTS:demo@example.com}
  default-whatsapp-recipients: ${ALERT_WHATSAPP_RECIPIENTS:+263700000000}